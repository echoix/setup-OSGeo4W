# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation
---
# MegaLinter Docker image flavor and version, used by mega-linter-runner and coding agents
MEGALINTER_FLAVOR: all
MEGALINTER_VERSION: v10

# all, none, or list of linter keys
APPLY_FIXES: none

SHOW_ELAPSED_TIME: true

# Reporters
FILEIO_REPORTER: false
GITHUB_COMMENT_REPORTER: false
# Writes megalinter-report.md and, when running in GitHub Actions, appends it
# to the job summary natively ($GITHUB_STEP_SUMMARY)
MARKDOWN_SUMMARY_REPORTER: true

# Allow zizmor to use GITHUB_TOKEN for its online audits (tag lookups)
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
